<style>
/* Koordinator TO TKA (22 Okt 2026, RENCANA_TO_TKA.md): jadwal TO Mapel Wajib & Pilihan, pengumpulan soal guru, sesi + link CBT,
   rekap & laporan per periode. Gaya sama dengan pas.html / kurikulum.html. Grafik dibuat sendiri (HTML/SVG). */
:root{--bg:var(--kertas);--card:#fff;--ink:var(--tinta);--muted:var(--tinta-2);--line:var(--garis);
  --seri:#2a78d6;--baik:#2F7A4C;--cukup:#B7862A;--kurang:#A8432E;
  --s-tunggu:#EDE8DD;--s-tunggu-t:#5E5548;--s-telat:#F7E4DF;--s-telat-t:#7C2F1F;--s-siap:#E3EDF3;--s-siap-t:#234A63;
  --s-jadwal:#cde2fb;--s-jadwal-t:#184f95;--s-jalan:#FFF6D2;--s-jalan-t:#8F6B1A;--s-selesai:#E4EFE7;--s-selesai-t:#2B4B37;--s-lewat:#F3EFE6;--s-lewat-t:#8B8173}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:12px 16px 64px}
header.top{background:var(--gelap);color:#fff;padding:10px 16px;border-bottom:4px solid var(--emas);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top img{height:40px}header.top .t{font-weight:700;font-size:17px}header.top .sub{font-size:12px;color:var(--emas)}
header.top .kanan{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top .kanan a,header.top .kanan button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0;text-wrap:balance}h2{font-size:22px}h3{font-size:17px}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}.kecil{font-size:12px}.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.kolom{display:flex;flex-direction:column;gap:10px}
button{font-family:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;background:var(--gelap);color:var(--emas);font-weight:700}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--garis-2)}button.ghost:hover{border-color:var(--emas-tua)}button.mini{padding:4px 10px;font-size:13px}button:disabled{opacity:.5;cursor:default}
button.bahaya{background:#fff;color:var(--kurang);border:1px solid #E6B9AE}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{padding:7px 10px;font-size:14px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:#fff;color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--netral-muda);color:var(--tinta-2);font-weight:700;white-space:nowrap}
.alis{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--emas-teks);font-weight:700}
.kepala{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:4px;margin:12px 0;padding:5px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid rgba(214,204,182,.7);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--tinta-2);border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}
.tabs button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button:hover{background:var(--kertas-3);color:var(--gelap)}.tabs button.on{background:var(--gelap);color:#fff}.tabs button.on svg{color:var(--emas)}
.gulir{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--kertas-3);text-align:left;font-size:12px;color:var(--tinta-2);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:center}tr.klik{cursor:pointer}tr.klik:hover td{background:var(--emas-kabut)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120%);background:var(--gelap);color:#fff;padding:10px 16px;border-radius:10px;z-index:500;opacity:0;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%);opacity:1}
.ubin{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ubin>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ubin b{display:block;font-family:"Fraunces",Georgia,serif;font-size:30px;line-height:1.1;color:var(--gelap)}
.ubin span{font-size:12px;color:var(--muted);font-weight:600}.ubin em{display:block;font-style:normal;font-size:12px;color:var(--tinta-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}.grid2>.card{margin:0}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px 20px}
.grafik h3{margin-bottom:2px}.grafik .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.kosong{padding:24px;text-align:center;color:var(--muted)}
/* status TO: warna + ikon + tulisan */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-tunggu{background:var(--s-tunggu);color:var(--s-tunggu-t)}.st-telat{background:var(--s-telat);color:var(--s-telat-t)}.st-siap{background:var(--s-siap);color:var(--s-siap-t)}
.st-jadwal{background:var(--s-jadwal);color:var(--s-jadwal-t)}.st-jalan{background:var(--s-jalan);color:var(--s-jalan-t)}.st-selesai{background:var(--s-selesai);color:var(--s-selesai-t)}
.st-lewat,.st-batal,.st-pra{background:var(--s-lewat);color:var(--s-lewat-t)}.st-pra{font-weight:600}
.to-g{border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px}
.to-g .baris{display:grid;grid-template-columns:minmax(80px,max-content) 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.to-g .baris:hover{background:var(--emas-kabut)}.to-g .baris+.baris{border-top:1px dashed var(--garis)}
.laci select,.laci input[type=text]{max-width:100%;min-width:0}.laci label.f.grow{min-width:0;flex:1 1 220px}
/* kartu TO di Minggu Ini */
.to-list{display:grid;gap:10px}
.to-k{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.to-k:hover{border-color:var(--emas)}
.to-tgl{width:58px;text-align:center;border-radius:10px;background:var(--kertas-3);padding:6px 4px;line-height:1.1}.to-tgl b{display:block;font-family:"Fraunces",Georgia,serif;font-size:22px}.to-tgl span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.to-k .jdl{font-weight:700}.to-k .ket{font-size:13px;color:var(--muted)}
.alur{display:flex;gap:3px;margin-top:6px}.alur i{flex:1;height:5px;border-radius:3px;background:var(--garis)}.alur i.on{background:var(--seri)}.alur i.on.akhir{background:var(--baik)}.alur i.telat{background:var(--kurang)}
/* kalender */
.kal{border-collapse:separate;border-spacing:3px;font-size:12px}.kal th{background:none;border:0;padding:4px 2px;text-align:center;font-weight:600;color:var(--tinta-2)}
.kal th.ini{color:var(--gelap)}.kal th.ini span{background:var(--emas);color:var(--gelap);border-radius:6px;padding:1px 5px}
.kal td{border:0;padding:0}.kal td.lb{padding:0 8px 0 0;white-space:nowrap;font-weight:700}
.sel-to{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;height:46px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;border:2px solid transparent;line-height:1.1;text-align:center}
.sel-to small{font-weight:600;font-size:10px;opacity:.85}.sel-to:hover{border-color:var(--emas)}.sel-to.pilih{border-color:var(--gelap)}
.sel-kosong{min-width:54px;height:46px;border-radius:8px;background:repeating-linear-gradient(135deg,#F3EFE6 0 6px,#fff 6px 12px)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tinta-2);margin-top:8px}.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* laci rincian */
.laci{position:fixed;inset:0;background:rgba(29,42,58,.35);z-index:300;display:flex;justify-content:flex-end}
.laci>div{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);box-shadow:-10px 0 30px rgba(0,0,0,.15);padding:18px}
.laci .card{margin:10px 0}
.cek{display:grid;gap:4px;font-size:13px}.cek .ok{color:var(--baik)}.cek .no{color:var(--kurang)}
.kodebesar{font-family:Consolas,ui-monospace,monospace;font-size:22px;font-weight:700;letter-spacing:3px}
.qr-modal{position:fixed;inset:0;background:rgba(29,42,58,.85);z-index:400;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;text-align:center;padding:16px}
.qr-modal .qr{background:#fff;padding:14px;border-radius:12px}.qr-modal .qr img,.qr-modal .qr canvas{width:min(70vmin,420px)!important;height:auto!important}
/* grafik */
.bh{display:grid;grid-template-columns:minmax(80px,max-content) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.bh .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.bh .nl{font-variant-numeric:tabular-nums;color:var(--tinta-2);font-weight:600;min-width:34px;text-align:right}
.bh .tr{height:14px;background:var(--kertas-3);border-radius:4px;overflow:hidden}.bh .br{display:block;height:100%;background:var(--seri);border-radius:0 4px 4px 0;min-width:2px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}svg.ch text{font-family:inherit;font-size:11px;fill:var(--tinta-2)}
svg.ch .sumbu{stroke:var(--garis-2);stroke-width:1}svg.ch .kisi{stroke:var(--garis);stroke-width:1;stroke-dasharray:2 3}svg.ch .hit{fill:transparent}
.nil{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:2px 4px;font-weight:700}
.nil.b{background:#E4EFE7;color:var(--baik)}.nil.c{background:#FFF6D2;color:#8F6B1A}.nil.k{background:#F7E4DF;color:var(--kurang)}
.tip{position:fixed;z-index:450;pointer-events:none;background:var(--gelap);color:#fff;font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}.tip b{color:var(--emas)}
.prog{display:inline-flex;background:#fff;border:1px solid var(--garis-2);border-radius:10px;padding:3px;gap:3px}.prog button{background:none;color:var(--tinta-2);padding:6px 12px;font-size:13px}.prog button.on{background:var(--gelap);color:#fff}
.baca .tulis{display:none!important}
@media (max-width:640px){.ubin b{font-size:24px}h2{font-size:19px}.to-g{grid-template-columns:1fr}.to-g .to-tgl{display:none}.to-g .baris{grid-template-columns:1fr auto}.to-g .baris .info{grid-column:1/-1;order:3}}
</style>
</head>

<script>
"use strict";
const SB=(()=>{const c=window.TKA_SUPABASE||{};return c.url&&c.key?c:null})();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),ms||3400)}
async function rpc(fn,args){if(!SB)throw new Error("Server belum diatur (config.js)");
  const r=await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SB.key,.../^eyJ[\w-]*\.[\w-]+\.[\w-]*$/.test(SB.key)?{"Authorization":"Bearer "+SB.key}:{}},body:JSON.stringify(args||{})});
  let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j&&(j.message||j.hint||j.error))||("HTTP "+r.status));return j}
const WIB={timeZone:"Asia/Jakarta"};
const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const tglD=s=>{const [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};   // tanggal kalender (tanpa jam)
const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const tgl=x=>(x instanceof Date?x:/^\d{4}-\d\d-\d\d$/.test(x)?tglD(x):new Date(x)).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const tglP=x=>(x instanceof Date?x:/^\d{4}-\d\d-\d\d$/.test(x)?tglD(x):new Date(x)).toLocaleDateString("id-ID",{day:"numeric",month:"short"});
const hariTgl=x=>{const d=x instanceof Date?x:tglD(x);return `${HARI[d.getDay()]}, ${d.toLocaleDateString("id-ID",{day:"numeric",month:"long"})}`};
const jam=iso=>new Date(iso).toLocaleTimeString("id-ID",{...WIB,hour:"2-digit",minute:"2-digit"}).replace(":",".");
const waktu=iso=>new Date(iso).toLocaleString("id-ID",{...WIB,weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).replace(/\./g,":").replace(/(\d\d):(\d\d)$/,"$1.$2");
const angka=(x,d=1)=>x==null||isNaN(x)?"–":Number(x).toLocaleString("id-ID",{maximumFractionDigits:d});
const rata=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const urutID=(a,b)=>String(a).localeCompare(String(b),"id",{numeric:true});
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const senin=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const tambahHari=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const keLokal=d=>`${isoD(d)}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;   // untuk input datetime-local
const SINGKAT={"Bahasa Indonesia":"BI","Matematika":"MTK","Bahasa Inggris":"BIG","Sosiologi":"SOS","Ekonomi":"EKO","Geografi":"GEO","Bahasa Inggris TL":"BIG TL",
  "Bahasa Jepang":"JPG","Bahasa Arab":"ARB","Pendidikan Pancasila":"PKN","Biologi":"BIO","Fisika":"FIS","Kimia":"KIM","Matematika TL":"MTK TL","Sejarah":"SEJ"};
const singkat=m=>SINGKAT[m]||m.split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,4);
const KKM=()=>{const v=lsGet("to_kkm",75);return v>=0&&v<=100?v:75};
const kelasNilai=v=>v==null?"":v>=KKM()?"b":v>=KKM()-15?"c":"k";
function salin(teks,pesan){(navigator.clipboard?navigator.clipboard.writeText(teks):Promise.reject()).then(()=>toast(pesan||"Disalin")).catch(()=>{const t=document.createElement("textarea");t.value=teks;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast(pesan||"Disalin")}catch(e){prompt("Salin teks ini:",teks)}t.remove()})}
const linkCBT=kode=>new URL("index.html",location.href).href.split("#")[0]+"#kode="+kode;

/* ---------------- grafik ---------------- */
const bulatAtas=v=>{if(v<=4)return Math.max(2,Math.ceil(v/2)*2);const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
function grafikBH(it,o={}){if(!it.length)return '<p class="kosong">Belum ada data.</p>';const mx=o.maks||Math.max(...it.map(x=>x.nilai),1);

/* Status satu TO (baris jadwal). Sesi = yang dibuka lewat halaman ini (j.sesi) + sesi lain yang cocok (paket semapel, kelas sama,
   tanggal ±3 hari) — supaya TO yang dibuka guru dari menu Latihan/Tryout tetap terhitung. */
const ALUR=["tunggu","siap","jadwal","jalan","selesai"];
const ST={tunggu:["Menunggu soal","○"],telat:["Soal terlambat","!"],siap:["Soal siap","◔"],jadwal:["Sesi terjadwal","◑"],jalan:["Berlangsung","◕"],selesai:["Selesai","●"],lewat:["Terlewat","–"],batal:["Dibatalkan","×"],pra:["Sebelum aplikasi","·"]};
const pilSt=k=>`<span class="st st-${k}">${ST[k][1]} ${ST[k][0]}</span>`;
function siapkan(){
  PK={};D.paket.forEach(p=>PK[p.kode]=p);S={};D.sesi.forEach(s=>{s.T0=Date.parse(s.mulai);s.T1=Date.parse(s.sampai);S[s.id]=s});
  SISWA={};KELAS_N={};D.siswa.forEach(([n,nm,k])=>{SISWA[n]={nama:nm,kelas:k};KELAS_N[k]=(KELAS_N[k]||0)+1});
  BACA=D.peran==="kurikulum";document.body.classList.toggle("baca",BACA);
  J=D.jadwal.map(j=>({...j,d0:tglD(j.mulai),d1:tglD(j.akhir),sesiSimpan:j.sesi||[],S:[]}));
  // sesi tersimpan
  const dipakai=new Set();J.forEach(j=>j.sesiSimpan.forEach(id=>{if(S[id]){j.S.push(S[id]);dipakai.add(id)}}));
  // sesi lain yang cocok → TO terdekat
  D.sesi.filter(s=>!dipakai.has(s.id)).forEach(s=>{const p=PK[s.ujian];if(!p)return;const t=tglD(new Date(s.T0).toLocaleDateString("en-CA",WIB));
    let best=null,bd=99;J.forEach(j=>{if(j.mk!==p.mk||!j.kelas.some(k=>s.kelas.includes(k)))return;const dd=t<j.d0?(j.d0-t)/864e5:t>j.d1?(t-j.d1)/864e5:0;if(dd<=3&&dd<bd){bd=dd;best=j}});
    if(best){best.S.push(s);s.cocok=true}});
  const kini=Date.now();
  // TO sebelum aplikasi dipakai untuk TO (sesi/hasil pertama) tidak dihitung sebagai "terlewat"
  const awal=[...D.sesi.map(x=>x.T0),...D.hasil.map(h=>Date.parse(h[4]))];window.APP0=awal.length?senin(new Date(Math.min(...awal))):null;
  J.forEach(j=>{j.S.sort((a,b)=>a.T0-b.T0);j.paketEff=j.paket||(j.S[0]&&j.S[0].ujian)||null;j.p=PK[j.paketEff]||null;
    j.target=j.kelas.reduce((a,k)=>a+(KELAS_N[k]||0),0);j.guru=namaGuru(j.guru_id);
    j.tenggat=tambahHari(senin(j.d0),-3);   // Jumat sebelum minggu pelaksanaan
    const ids=new Set(j.S.map(s=>s.id)),r0=tambahHari(j.d0,-3).getTime(),r1=tambahHari(j.d1,4).getTime();
    j.H=D.hasil.filter(h=>j.kelas.includes(h[1])&&(h[5]?ids.has(h[5]):(h[2]===j.paketEff&&Date.parse(h[4])>=r0&&Date.parse(h[4])<r1)));
    j.nisn=new Set(j.H.map(h=>h[0]));j.rata=rata(j.H.map(h=>h[3]));
    const akhirHari=tambahHari(j.d1,1).getTime(),lewatHari=kini>=akhirHari;
    if(j.batal)j.st="batal";
    else if(j.S.some(s=>s.T0<=kini&&s.T1>kini))j.st="jalan";
    else if(j.S.some(s=>s.T0>kini))j.st="jadwal";
    else if(j.S.length||j.H.length)j.st="selesai";
    else if(lewatHari&&(!APP0||j.d1<APP0))j.st="pra";
    else if(j.paketEff)j.st=lewatHari?"lewat":"siap";
    else j.st=lewatHari?"lewat":kini>tambahHari(j.tenggat,1).getTime()?"telat":"tunggu"});
  // pilihan semester
  const per=$("f-periode");if(!per.options.length){const [y1,y2,s]=D.periode.kode.split("-").map(Number),L=[];let a=y1,b=y2,c=s;
    for(let i=0;i<3;i++){L.push([`${a}-${b}-${c}`,`Semester ${c===1?"Ganjil":"Genap"} ${a}/${b}`]);if(c===2)c=1;else{c=2;a--;b--}}
    L.reverse();const nx=s===1?[`${y1}-${y2}-2`,`Semester Genap ${y1}/${y2}`]:[`${y2}-${y2+1}-1`,`Semester Ganjil ${y2}/${y2+1}`];L.push(nx);
    per.innerHTML=L.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");per.value=D.periode.kode}
  $("k-periode").textContent="Semester "+D.periode.nama+(BACA?" · hanya melihat":"");
  const w=J.filter(j=>j.program==="wajib"&&!j.batal),p=J.filter(j=>j.program==="pilihan"&&!j.batal);
  $("k-info").textContent=`${new Set(w.map(j=>j.mulai)).size} TO Mapel Wajib · ${new Set(p.map(j=>j.mulai)).size} minggu TO Mapel Pilihan · data per ${new Date(D.sekarang).toLocaleString("id-ID",{...WIB,day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}`;
}

// urutan TO: tanggal → Wajib dulu → tingkat/kelas naik

function grupTO(L){const g=new Map();[...L].sort(URUT_TO).forEach(j=>{const k=j.program+"|"+j.mulai+"|"+j.mapel;if(!g.has(k))g.set(k,[]);g.get(k).push(j)});return [...g.values()]}
function kartuGrup(a){const j0=a[0],d=j0.d0,guru=[...new Set(a.map(j=>namaPendek(j.guru_id)))].join(", ");

      ${a.map(j=>`<div class="baris" data-buka="${j.id}"><b class="small">${esc(sasaran(j))}${j.jenis==="Tryout UTBK"?" · UTBK":""}</b>

function gMinggu(){const el=$("tab-minggu"),kini=new Date(),s0=senin(kini),s1=tambahHari(s0,7),n0=s1,n1=tambahHari(s1,7);
  const aktif=J.filter(j=>!j.batal),pekan=(a,b)=>aktif.filter(j=>j.d0<b&&tambahHari(j.d1,1)>a);
  let ini=pekan(s0,s1),judulIni="Minggu ini";
  if(!ini.length){const nx=aktif.filter(j=>j.d0>=s1).sort((a,b)=>a.d0-b.d0)[0];if(nx){const a=senin(nx.d0);ini=pekan(a,tambahHari(a,7));judulIni="TO berikutnya"}}
  const depan=pekan(n0,n1),jumat=tambahHari(s0,4);
  // angka semester
  const sdh=J.filter(j=>!j.batal&&j.st!=="pra"&&j.d1<kini),selesai=sdh.filter(j=>j.st==="selesai"),tgt=selesai.reduce((a,j)=>a+targetLaksana(j),0),ikut=selesai.reduce((a,j)=>a+j.nisn.size,0);
  const nil=selesai.flatMap(j=>j.H.map(h=>h[3])),soalDepan=depan.filter(j=>j.paketEff).length;
  const urut=URUT_TO;
  // Pilihan: satu minggu, kelompokkan per mapel
  const blok=L=>{const w=L.filter(j=>j.program==="wajib").sort(urut),p=L.filter(j=>j.program==="pilihan").sort(urut);
    return (w.length?`<p class="small" style="margin:4px 0 6px"><b>Mapel Wajib</b></p><div class="to-list">${grupTO(w).map(kartuGrup).join("")}</div>`:"")+
      (p.length?`<p class="small" style="margin:14px 0 6px"><b>Mapel Pilihan kelas 11</b> · ${tglP(p[0].d0)}–${tglP(p[0].d1)}, menyesuaikan jadwal pelajaran tiap kelas</p><div class="to-list">${grupTO(p).map(kartuGrup).join("")}</div>`:"")||'<p class="kosong">Tidak ada TO.</p>'};
  const belumSoal=depan.filter(j=>!j.paketEff);
  el.innerHTML=`<div class="ubin" style="margin-top:12px">${[
      [`${selesai.length}/${sdh.length}`,"TO terlaksana",APP0?`sejak TO pertama di aplikasi (${tglP(APP0)})`:"belum ada TO di aplikasi"],
      [tgt?angka(ikut/tgt*100,0)+"%":"–","partisipasi",`${ikut} dari ${tgt} siswa sasaran`],
      [angka(rata(nil)),"rata-rata nilai",`${nil.length?angka(nil.filter(x=>x>=KKM()).length/nil.length*100,0):"–"}% ≥ ${KKM()}`],
      [`${soalDepan}/${depan.length}`,"soal minggu depan masuk",`tenggat ${hariTgl(jumat)}`]].map(([a,b,c])=>`<div><b>${a}</b><span>${b}</span><em>${c}</em></div>`).join("")}</div>
    <div class="card"><div class="kepala"><div><div class="alis">${judulIni}</div><h3>${ini.length?`${tglP(senin(ini[0].d0))} – ${tglP(tambahHari(senin(ini[0].d0),4))}`:"Tidak ada TO terjadwal"}</h3></div>
      ${!BACA&&ini.some(j=>j.st==="siap")?`<button id="m-buka-semua">Buka semua sesi yang soalnya siap (${ini.filter(j=>j.st==="siap").length})</button>`:""}</div>
      <div style="margin-top:10px">${blok(ini)}</div></div>
    <div class="card"><div class="kepala"><div><div class="alis">Tenggat ${hariTgl(jumat)}</div><h3>Soal untuk minggu depan (${tglP(n0)} – ${tglP(tambahHari(n0,4))})</h3></div>
      ${!BACA&&belumSoal.length?`<button class="ghost" id="m-wa-semua">Salin pengingat WA (${new Set(belumSoal.map(j=>j.guru_id)).size} guru)</button>`:""}</div>
      <div style="margin-top:10px">${depan.length?blok(depan):'<p class="kosong">Tidak ada TO minggu depan.</p>'}</div></div>
    <div class="card"><h3 style="margin-bottom:8px">Alur satu TO</h3><div class="legenda" style="margin:0">${["tunggu","siap","jadwal","jalan","selesai","telat","lewat"].map(k=>pilSt(k)).join(" ")}</div>
      <p class="small muted" style="margin-top:8px">Guru mengunggah soal (2 paket = 2 varian, 5 soal; MTK 3 soal) paling lambat Jumat sebelumnya → koordinator memasang soal ke jadwal → buka sesi dan bagikan link → siswa mengerjakan dengan NISN → hasil masuk ke Rekap.</p></div>`;
  ikatBuka(el);

}
function teksPengingat(L){const g={};L.forEach(j=>(g[j.guru_id||"-"]=g[j.guru_id||"-"]||[]).push(j));
  return `Assalamu'alaikum Bapak/Ibu. Pengingat soal *TO TKA* untuk minggu ${tglP(senin(L[0].d0))}–${tglP(tambahHari(senin(L[0].d0),4))}, mohon diunggah ke Asesmen Merdeka (Pustaka Paket, jenis *Tryout TKA*) paling lambat *${hariTgl(L[0].tenggat)}*:\n`+
    Object.entries(g).map(([id,a])=>`• ${namaGuru(id)}: ${[...new Set(a.map(j=>j.mapel))].join(", ")} (${a.map(j=>j.program==="wajib"?`kelas ${j.tingkat}, ${hariTgl(j.d0)}`:j.kelas.join("/")).join("; ")})`).join("\n")+

function skorPaket(p,j){return (/tryout/i.test(p.jenis||"")?4:0)+((p.tingkat||[]).map(String).includes(String(j.tingkat))||String(p.kelas||"").includes(j.tingkat)?2:0)+(J.some(x=>x.paket===p.kode)?-3:0)}

async function unduhRekap(per){const R=dataRekap(per);if(!R||!R.L.length)throw new Error("Belum ada TO pada periode ini");const {kol,kelas,siswa}=R,kkm=KKM();

     baris:siswa.map((s,i)=>[i+1,s.nama,s.kelas,s.nisn,...kol.map(c=>{const x=s.nil[c.k];return x===undefined?"":x===null?"TH":x}),s.rata==null?"":Math.round(s.rata*10)/10,`${s.ikut}/${s.wajib}`]),
     warnaSel:(b,j)=>j>=4?merah(b[j]):null},
    {nama:"Rekap kelas",judul:"Rata-rata & partisipasi per kelas",sub,beku:1,melintang:false,
     kolom:[{t:"Kelas",w:9,tebal:true},{t:"Siswa",w:8},...kol.map(c=>({t:kl(c),w:12,fmt:"0.0"})),{t:"Rata-rata",w:10,fmt:"0.0",tebal:true},{t:"Partisipasi %",w:12}],
     baris:kelas.map(k=>{const S2=siswa.filter(s=>s.kelas===k),vv=S2.flatMap(s=>Object.values(s.nil).filter(x=>x!=null)),sl=S2.reduce((a,s)=>a+s.wajib,0);
       return [k,S2.length,...kol.map(c=>{const n=S2.map(s=>s.nil[c.k]).filter(x=>x!=null);return n.length?Math.round(rata(n)*10)/10:""}),vv.length?Math.round(rata(vv)*10)/10:"",sl?Math.round(vv.length/sl*100):""]}),
     warnaSel:(b,j)=>j>=2?merah(b[j]):null},
    {nama:"Tidak ikut",judul:"Siswa yang tidak mengerjakan TO",sub,beku:1,melintang:false,kolom:[{t:"No",w:5},{t:"Nama",w:32},{t:"Kelas",w:9},{t:"NISN",w:13},{t:"TO tidak dikerjakan",w:40,bungkus:true}],
     baris:siswa.filter(s=>s.ikut<s.wajib).map((s,i)=>[i+1,s.nama,s.kelas,s.nisn,kol.filter(c=>s.nil[c.k]===null).map(kl).join(", ")])}]});
  return nama}
